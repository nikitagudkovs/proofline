<script>window.__PROOFLINE__ = { demo: {"overview":{"repo":{"name":"textkit","root":"~/code/textkit"},"job":null,"lastError":"","config":{"concurrency":3,"maxFixRounds":2,"setup":"","worktreeDir":"~/.proofline/worktrees","auth":"subscription","models":{"planner":"sonnet","builder":"sonnet","verifier":"sonnet"},"builder":{"permissionMode":"acceptEdits","allowedTools":["Bash","Edit","Write","Read","Glob","Grep"]},"claudeArgs":["--setting-sources","project,local"],"timeouts":{"plannerMin":15,"builderMin":45,"verifierMin":10,"commandSec":600}},"accounts":[{"ok":true,"label":"git author","detail":"commits are written as Ada Lovelace"},{"ok":true,"shipOnly":true,"label":"git remote","detail":"ship pushes to git@github.com:ada/textkit.git"},{"ok":true,"shipOnly":true,"label":"GitHub account","detail":"pull requests are opened as ada"},{"ok":true,"label":"Claude Code","detail":"agents run on your Claude subscription (max)"}],"contract":{"exists":true,"contract":{"goal":"Add truncate, slugify and wordCount helpers to the textkit library, each with its own test file, plus a bin/textkit.js command-line script that runs any of them by name, and document everything in the README.","outOfScope":["Changing or removing the existing capitalize helper or its test","Adding dependencies, a build step, a linter or a different test runner","Unicode-aware slugging (accent stripping, punctuation removal, non-Latin scripts)","Adding a package.json bin field, publishing, or changing the version","CLI features beyond running the three helpers by name (flags, help text, interactive mode, other helpers)","Exact CLI error messages or exit codes for bad input"],"criteria":[{"id":"C1","text":"truncate(text, max) is exported from src/index.js. When text is longer than max, it returns a string of at most max characters that ends with exactly one '…' (U+2026) and keeps the start of the text. When text already fits within max, it is returned unchanged.","proof":{"type":"command","run":"node --input-ty
